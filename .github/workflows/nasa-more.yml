name: Additional NASA space B-roll
on:
  push:
    branches: [shortform-nasa-source-20261010]
    paths: ['.github/workflows/nasa-more.yml']
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests beautifulsoup4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python nasa_space_more.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nasa-additional-footage
          path: more/
          retention-days: 1
          if-no-files-found: error
