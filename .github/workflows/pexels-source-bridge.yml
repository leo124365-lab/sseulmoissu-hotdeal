name: Temporary Pexels shortform source bridge
on:
  push:
    branches: [shortform-pexels-bridge-20261010]
    paths:
      - '.github/workflows/pexels-source-bridge.yml'
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download licensed animal action clips
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources
          for item in \
            'cat_box|https://videos.pexels.com/video-files/5495527/5495527-hd_1080_1920_29fps.mp4' \
            'cat_sofa|https://videos.pexels.com/video-files/4807151/4807151-hd_1280_720_30fps.mp4' \
            'otters_swim|https://www.pexels.com/download/video/2554522/' \
            'kitten_toy|https://www.pexels.com/download/video/34689567/' \
            'cat_shelf|https://www.pexels.com/download/video/6853178/'; do
            IFS='|' read -r name url <<< "$item"
            echo "Trying $name"
            if curl --fail --location --max-filesize 70000000 --connect-timeout 15 --max-time 110 -sS -A 'Mozilla/5.0' -o "sources/$name.mp4" "$url"; then
              file "sources/$name.mp4"
            else
              echo "OPTIONAL_DOWNLOAD_FAILED $name"
              rm -f "sources/$name.mp4"
            fi
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          for video in sources/*.mp4; do
            echo "CHECK $video"
            if ! ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$video"; then rm -f "$video"; fi
          done
      - name: Save media result
        uses: actions/upload-artifact@v4
        with:
          name: pexels-animal-extra-action-clips
          path: sources/*.mp4
          retention-days: 1
          if-no-files-found: error
